<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

html,
body,
#app {
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;
  background-color: #000;
}

    </style>
</head>
<body>
  
        <div id="app"></div>
<script type="module">
        import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.186.1/three.module.js";

  const ROAD_LENGTH = 1000;

  window.addEventListener("load", init);

  function init() {
    const app = document.getElementById("app");
    const objects = createSceneObjects();

    addRendererElement(app, objects.renderer);
    addSceneElements(objects.scene, objects.camera, objects.car);
    addShadowSettings(objects.scene);
    addResizeHandler(objects.camera, objects.renderer);
    animate(objects);
  }

  function createSceneObjects() {
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      10000,
    );
    camera.position.set(100, 100, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setClearColor(0x000008);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setSize(window.innerWidth, window.innerHeight);

    return { scene, camera, renderer, car: makeCar() };
  }

  function addRendererElement(
    app,
    renderer,
  ) {
    app.appendChild(renderer.domElement);
  }

  function addSceneElements(
    scene,
    camera,
    car,
  ) {
    addAxes(scene);
    addGround(scene);
    // addLighting(scene);
    addRoad(scene);
    addHouse(scene);
    addTrees(scene);
    addCar(scene, car);
    addLampposts(scene);
    camera.lookAt(scene.position);
  }

  function addAxes(scene) {
    scene.add(new THREE.AxesHelper(1000));
  }

  function addGround(scene) {
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(1000, 1000),
      new THREE.MeshStandardMaterial({ color: 0x00ff00, side: THREE.DoubleSide }),
    );
    floor.rotation.x = Math.PI / 2;
    scene.add(floor);
  }

  function addLighting(scene) {
    scene.add(new THREE.AmbientLight(0x142040, 0.12));

    const moonLight = new THREE.DirectionalLight(0x9bbcff, 0.35);
    moonLight.position.set(-100, 200, -100);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(2048, 2048);
    moonLight.shadow.camera.near = 0.5;
    moonLight.shadow.camera.far = 500;
    moonLight.shadow.camera.left = -250;
    moonLight.shadow.camera.right = 250;
    moonLight.shadow.camera.top = 250;
    moonLight.shadow.camera.bottom = -250;
    scene.add(moonLight);
  }

  function addRoad(scene) {
    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(ROAD_LENGTH, 50),
      new THREE.MeshStandardMaterial({ color: 0x333333, side: THREE.DoubleSide }),
    );
    road.position.set(0, 0.1, 0);
    road.rotation.x = Math.PI / 2;
    scene.add(road);
  }

  function addHouse(scene) {
    const house = makeHouse();
    house.position.set(30, 0, -50);
    scene.add(house);
  }

  function addTrees(scene) {
    for (let i = 0; i < 40; i++) {
      const tree = makeTree();
      tree.position.set(-500 + i * 25, 0, 30);
      tree.scale.set(3, 3, 3);
      scene.add(tree);
    }
  }

  function addCar(scene, car) {
    car.position.set(70, 0, 0);
    car.scale.set(5, 5, 5);
    scene.add(car);
  }

  function addLampposts(scene) {
    for (let i = 0; i < 10; i++) {
      const lamppost = createLamppost(-500 + i * 100, 0, -25);
      lamppost.scale.set(4, 4, 4);
      scene.add(lamppost);
    }
  }

  function addShadowSettings(scene) {
    scene.traverse((object) => {
      if (object instanceof THREE.Mesh) {
        object.castShadow = true;
        object.receiveShadow = true;
      }
    });
  }

  function addResizeHandler(
    camera,
    renderer,
  ) {
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  function animate({ scene, camera, renderer, car }) {
    const clock = new THREE.Clock();
    let carSpeed = 60;
    let drivingDirection = 1;

    function render() {
      requestAnimationFrame(render);

      car.position.x += carSpeed * clock.getDelta();
      if (car.position.x >= ROAD_LENGTH / 2) {
        car.position.x = ROAD_LENGTH / 2;
        carSpeed *= -1;
        carSpeed += 10;
        drivingDirection = -1;
        car.rotation.y = Math.PI;
      } else if (car.position.x <= -ROAD_LENGTH / 2) {
        car.position.x = -ROAD_LENGTH / 2;
        carSpeed *= -1;
        carSpeed += 10;
        drivingDirection = 1;
        car.rotation.y = 0;
      }

      camera.position.set(
        car.position.x - drivingDirection * 80,
        car.position.y + 30,
        car.position.z + 20,
      );
      camera.lookAt(
        car.position.x + drivingDirection * 100,
        car.position.y,
        car.position.z,
      );
      renderer.render(scene, camera);
    }

    render();
  }

  const makeHouse = () => {
    const house = new THREE.Group();

    const wallsGeometry = new THREE.BoxGeometry(20, 20, 20);

    const wallsMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
    const walls = new THREE.Mesh(wallsGeometry, wallsMaterial);
    walls.position.set(0, 10, 0);
    house.add(walls);

    const doorGeometry = new THREE.BoxGeometry(5, 10, 1.01);
    const doorMaterial = new THREE.MeshStandardMaterial({ color: 0x654321 });
    const door = new THREE.Mesh(doorGeometry, doorMaterial);
    door.position.set(0, 5, 10);
    house.add(door);

    const windowGeometry = new THREE.BoxGeometry(5, 5, 1);
    const windowMaterial = new THREE.MeshStandardMaterial({ color: 0x00ffff });
    const window1 = new THREE.Mesh(windowGeometry, windowMaterial);
    window1.position.set(-7, 12.5, 10);
    house.add(window1);

    const roofGeometry = new THREE.ConeGeometry(15, 10, 4);
    const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x540716 });
    const roof = new THREE.Mesh(roofGeometry, roofMaterial);
    roof.position.y = 25;
    roof.rotation.y = Math.PI / 4;
    house.add(roof);

    return house;
  };

  const makeTree = () => {
    const tree = new THREE.Group();

    const trunkGeometry = new THREE.CylinderGeometry(1, 1, 5);
    const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
    const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
    trunk.position.y = 2.5;
    tree.add(trunk);

    const foliageGeometry = new THREE.ConeGeometry(3, 6, 8);
    const foliageMaterial = new THREE.MeshStandardMaterial({ color: 0x228b22 });
    const foliage = new THREE.Mesh(foliageGeometry, foliageMaterial);
    foliage.position.y = 7;
    tree.add(foliage);

    return tree;
  };

  const makeCar = () => {
    const car = new THREE.Group();

    const bodyGeometry = new THREE.BoxGeometry(4, 1.5, 2);
    const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    body.position.y = 1;
    car.add(body);

    const wheelGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.5, 32);
    const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });

    const wheelPositions = [
      [-1.5, 0.5, -1], // front left
      [1.5, 0.5, -1], // front right
      [-1.5, 0.5, 1], // back left
      [1.5, 0.5, 1], // back right
    ];

    wheelPositions.forEach((pos) => {
      const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
      wheel.rotation.z = Math.PI / 2;
      wheel.rotation.y = Math.PI / 2;
      wheel.position.set(pos[0], pos[1], pos[2]);
      car.add(wheel);
    });

    [-0.65, 0.65].forEach((z) => {
      const headlamp = new THREE.Mesh(
        new THREE.SphereGeometry(0.25, 16, 16),
        new THREE.MeshStandardMaterial({
          color: 0xffffcc,
          emissive: 0xffffaa,
          emissiveIntensity: 2,
        }),
      );
      headlamp.position.set(2.05, 1.3, z);
      car.add(headlamp);

      const spotlightTarget = new THREE.Object3D();
      spotlightTarget.position.set(40, 0.5, z);
      car.add(spotlightTarget);

      const spotlight = new THREE.SpotLight(
        0xffffcc,
        12000,
        500,
        Math.PI / 7,
        0.5,
        2,
      );
      spotlight.target = spotlightTarget;
      spotlight.castShadow = true;
      spotlight.shadow.mapSize.set(1024, 1024);
      spotlight.shadow.camera.near = 0.5;
      spotlight.shadow.camera.far = 500;
      spotlight.shadow.bias = -0.001;
      spotlight.position.set(2.4, 1.3, z);
      car.add(spotlight);
      car.add(spotlight.target);
    });

    return car;
  };

  function createLamppost(a, b, c) {
    var lamppost = new THREE.Group();

    // base
    var baseGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.5, 8);
    var baseMaterial = new THREE.MeshLambertMaterial({
      color: 0x444444,
    });

    var baseMesh = new THREE.Mesh(baseGeometry, baseMaterial);
    baseMesh.position.y = -1.25;
    lamppost.add(baseMesh);

    // main vertical pole
    var poleGeometry = new THREE.CylinderGeometry(0.12, 0.12, 8, 8);
    var poleMaterial = new THREE.MeshLambertMaterial({
      color: 0x666666,
    });

    var poleMesh = new THREE.Mesh(poleGeometry, poleMaterial);
    poleMesh.position.y = 3;
    lamppost.add(poleMesh);

    // horizontal arm
    var armGeometry = new THREE.CylinderGeometry(0.1, 0.1, 4, 8);
    var armMaterial = new THREE.MeshLambertMaterial({
      color: 0x666666,
    });

    var armMesh = new THREE.Mesh(armGeometry, armMaterial);
    armMesh.position.set(1.8, 7.9, 0);
    armMesh.rotation.z = -Math.PI / 3; // rotate to horizontal
    lamppost.add(armMesh);

    // lamp head
    var lampGeometry = new THREE.BoxGeometry(0.8, 0.55, 1.7);
    var lampMaterial = new THREE.MeshLambertMaterial({
      color: 0x333333,
    });

    var lampMesh = new THREE.Mesh(lampGeometry, lampMaterial);
    lampMesh.position.set(4, 8.7, 0);
    lampMesh.rotation.y = Math.PI / 2;
    lamppost.add(lampMesh);

    // Spotlight
    var spotlight = new THREE.SpotLight(0xffffaa, 1500, 120, Math.PI / 5, 0.5, 2);
    spotlight.position.set(4, 8.5, 0);
    spotlight.target.position.set(4, 0, 0); // Point down and forward
    spotlight.castShadow = true;
    spotlight.shadow.mapSize.width = 1024;
    spotlight.shadow.mapSize.height = 1024;
    spotlight.shadow.camera.near = 0.5;
    spotlight.shadow.camera.far = 120;
    lamppost.add(spotlight);
    lamppost.add(spotlight.target);

    var coneRadius = Math.tan(Math.PI / 13) * 10;
    var coneGeometry = new THREE.ConeGeometry(coneRadius, 10, 20);
    var coneMaterial = new THREE.MeshLambertMaterial({
      color: 0xffffaa,
      transparent: true,
      opacity: 0.3,
      side: THREE.DoubleSide,
    });

    var lightCone = new THREE.Mesh(coneGeometry, coneMaterial);
    lightCone.position.set(4, 3.5, 0);
    lightCone.rotation.x = 0;
    lamppost.add(lightCone);

    // pos(variables)
    lamppost.position.set(a, b, c);
    lamppost.rotation.y = -Math.PI / 2;

    return lamppost;
  }

</script>
</body>
</html>
